services:
  file-service:
    build: .
    container_name: file-service
    ports:
      - "9094:9094"
    environment:
      - APP_ENV=production
      # user-service 对接：Docker 同网络内用服务名 user-service；若 user-service 在外部则改实际地址
      - USER_SERVICE_URL=http://user-service:8000
      - JWKS_CACHE_TTL_SECONDS=3600
      - STORAGE_DIR=storage
      - STORAGE_CATEGORIES=["image"]
      - MAX_FILE_SIZE=5242880
      - ALLOWED_CONTENT_TYPES=["image/jpeg","image/png","image/webp"]
      - ALLOWED_EXTENSIONS=[".jpg",".jpeg",".png",".webp"]
      - LOG_LEVEL=INFO
    volumes:
      # 上传的图片文件持久化到宿主机 ./storage 目录
      - ./storage:/app/storage
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9094/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
